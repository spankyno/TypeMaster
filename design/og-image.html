<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1200px;height:630px;overflow:hidden;background:#0a0a0a;font-family:'Inter','Helvetica Neue',Arial,sans-serif;color:#fafafa}
  .bg{position:absolute;inset:0;
    background:
      radial-gradient(620px 420px at 92% 8%, rgba(245,158,11,.28), transparent 70%),
      radial-gradient(520px 380px at 0% 100%, rgba(99,102,241,.16), transparent 70%),
      #0a0a0a}
  .grid{position:absolute;inset:0;opacity:.35;
    background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
    background-size:48px 48px;mask-image:linear-gradient(to bottom,#000 0%,transparent 85%)}
  .brand{position:absolute;left:72px;top:60px;display:flex;align-items:center;gap:20px}
  .brand svg{width:72px;height:72px;border-radius:18px}
  .brand .name{font-size:44px;font-weight:800;letter-spacing:-.02em}
  .pill{font-size:22px;font-weight:700;color:#fbbf24;background:rgba(245,158,11,.18);padding:4px 16px;border-radius:999px;margin-left:6px;vertical-align:middle}
  h1{position:absolute;left:72px;top:176px;width:640px;font-size:92px;line-height:1.04;font-weight:800;letter-spacing:-.035em}
  h1 em{font-style:normal;color:#f59e0b}
  .sub{position:absolute;left:72px;top:404px;width:560px;font-size:30px;line-height:1.35;color:#d4d4d8;font-weight:500}
  .url{position:absolute;left:72px;bottom:52px;font-size:28px;font-weight:600;color:#a3a3a3;display:flex;align-items:center;gap:12px}
  .url i{width:10px;height:10px;border-radius:50%;background:#f59e0b;display:block}
  .card{position:absolute;right:64px;top:56px;width:420px;background:rgba(23,23,23,.92);border:1.5px solid #2e2e2e;border-radius:28px;padding:28px 34px 26px;box-shadow:0 30px 80px rgba(0,0,0,.55)}
  .card .lab{font-size:20px;letter-spacing:.14em;text-transform:uppercase;color:#a3a3a3;font-weight:700}
  .card .big{font-size:112px;line-height:1;font-weight:800;letter-spacing:-.04em;color:#fff;margin:6px 0 2px}
  .card .big small{font-size:34px;font-weight:700;color:#f59e0b;letter-spacing:0;margin-left:10px}
  .metrics{display:flex;gap:14px;margin-top:16px}
  .m{flex:1;background:#141414;border:1.5px solid #2a2a2a;border-radius:18px;padding:14px 16px}
  .m b{display:block;font-size:38px;font-weight:800;line-height:1.05}
  .m span{font-size:17px;color:#a3a3a3;font-weight:600;letter-spacing:.06em}
  .m.k b{color:#38bdf8}.m.a b{color:#34d399}
  .kb{position:absolute;right:64px;top:420px;width:420px;display:flex;flex-direction:column;gap:9px;align-items:center}
  .row{display:flex;gap:9px}
  .key{width:52px;height:52px;border-radius:12px;background:#1c1c1c;border:1.5px solid #333;color:#bdbdbd;font:700 22px/50px 'Inter',sans-serif;text-align:center;text-transform:uppercase}
  .key.hot{background:#f59e0b;border-color:#fbbf24;color:#0a0a0a;box-shadow:0 0 30px rgba(245,158,11,.55)}
  .key.warm{background:rgba(244,63,94,.18);border-color:rgba(244,63,94,.55);color:#fda4af}
  .key.space{width:236px}
</style></head><body>
<div class="bg"></div><div class="grid"></div>
<div class="brand">
  <svg viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#f59e0b"/><rect x="10" y="20" width="44" height="26" rx="5" fill="none" stroke="#0a0a0a" stroke-width="4"/><path d="M18 29h4M28 29h4M38 29h4M22 38h20" stroke="#0a0a0a" stroke-width="4" stroke-linecap="round"/></svg>
  <div class="name">TypeMaster <span class="pill">PRO</span></div>
</div>
<h1>Mecanografía <em>al tacto</em></h1>
<div class="sub">En español, con práctica adaptativa y estadísticas de PPM, KPM y precisión.</div>
<div class="url"><i></i>typemaster-chi.vercel.app</div>
<div class="card">
  <div class="lab">Velocidad</div>
  <div class="big">86<small>PPM</small></div>
  <div class="metrics">
    <div class="m k"><b>412</b><span>KPM</span></div>
    <div class="m a"><b>97%</b><span>PRECISIÓN</span></div>
  </div>
</div>
<div class="kb">
  <div class="row"><div class="key">q</div><div class="key">w</div><div class="key hot">e</div><div class="key">r</div><div class="key">t</div><div class="key warm">y</div><div class="key">u</div></div>
  <div class="row"><div class="key">a</div><div class="key hot">s</div><div class="key">d</div><div class="key">f</div><div class="key">g</div><div class="key">h</div><div class="key">j</div></div>
  <div class="row"><div class="key space"></div></div>
</div>
</body></html>
